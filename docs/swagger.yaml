basePath: /
definitions:
  api.QueryRequest:
    properties:
      query:
        type: string
      top_k:
        type: integer
    type: object
  api.QueryResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/api.QueryResult'
        type: array
    type: object
  api.QueryResult:
    properties:
      content:
        type: string
      distance:
        type: number
      source:
        type: string
    type: object
info:
  contact: {}
  description: Embeds a query and returns the nearest chunks from Postgres+pgvector.
  title: go-rag-lab Query API
  version: "1.0"
paths:
  /healthz:
    get:
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - health
  /query:
    post:
      consumes:
      - application/json
      description: Embeds the query text with the same provider used at ingestion
        time, then returns the topK nearest chunks by cosine distance (nearest first).
      parameters:
      - description: Query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.QueryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search ingested chunks
      tags:
      - query
swagger: "2.0"
