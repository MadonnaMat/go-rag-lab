services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CI-only: a pre-baked Ollama with nomic-embed-text already pulled (see
  # docker/ollama-ci/Dockerfile), published to ghcr.io/madonnamat/
  # go-rag-lab-ollama-ci. Not started by local `make up` / `docker compose
  # up app` — local dev keeps using host-installed Ollama for GPU access
  # (see CLAUDE.md). CI starts this explicitly (`make ci-verify`) and
  # overrides app's OLLAMA_URL to point at it instead of host.docker.internal.
  ollama:
    image: ghcr.io/madonnamat/go-rag-lab-ollama-ci:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # No curl/wget in the base image, but the `ollama` CLI is — `list`
      # only succeeds once the server is actually responding.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: ingest
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Ollama runs on the host, not in compose (see CLAUDE.md) — this lets
      # the container reach it at host.docker.internal instead of localhost.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}?sslmode=disable
      EMBEDDING_PROVIDER: ollama
      # Local dev: host-installed Ollama via host.docker.internal (default
      # below). CI overrides this to http://ollama:11434 — the service
      # above, reached by its compose network name.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Used for corpus-summary generation (internal/chat.OllamaChat.Summarize),
      # not just /chat's serve-side use — ingest runs a chat call too.
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
    volumes:
      - ./lore_docs:/app/lore_docs:ro

  # One-shot: `docker compose run --rm migrate`, not `up` — applies
  # internal/store/migrations against db. Schema setup is a deliberate,
  # explicit step in the containerized world too, same as `make migrate`
  # is for native dev; app/serve don't depend on it running automatically.
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}?sslmode=disable

  serve:
    build:
      context: .
      target: serve
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}?sslmode=disable
      EMBEDDING_PROVIDER: ollama
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      SERVER_ADDR: ${SERVER_ADDR:-:8080}
      # Where the chat get_resource / lore_drop tools read and write .md
      # docs. Bind-mounted below (NOT :ro) so a lore_drop persists back to
      # the host lore_docs/ and a later `make ingest` / `docker compose up
      # app` re-ingests it.
      LORE_DIR: /app/lore_docs
    volumes:
      - ./lore_docs:/app/lore_docs
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
