name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same variable name make test reads locally (from .env). No .env
      # file exists in CI, so its `[ -f .env ] && . ./.env` sourcing line
      # is a harmless no-op here — TEST_DATABASE_URL comes from this
      # workflow env block instead, and `make test` behaves identically
      # either way.
      TEST_DATABASE_URL: postgres://rag:rag@localhost:5432/rag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: make build
      - name: Lint (gofmt + go vet)
        run: make lint
      - name: Test
        run: make test
      - name: Docker build
        run: make docker-build
