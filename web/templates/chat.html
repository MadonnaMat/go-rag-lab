<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go-rag-lab chat</title>
  <link rel="stylesheet" href="/static/tailwind.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body class="h-full bg-slate-950 text-slate-100">
  <div x-data="chatApp()" class="flex h-full flex-col max-w-3xl mx-auto">
    <header class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
      <h1 class="text-lg font-semibold">go-rag-lab chat</h1>

      <!-- Context-usage indicator: reflects the last context_usage event,
           clickable to send /compact (same as typing it) once it's known. -->
      <button
        type="button"
        @click="compact()"
        :disabled="streaming || contextTokens === null"
        :title="contextTokens === null ? 'No context usage reported yet' : `${usedTokens} / ${contextTokens} tokens — click to compact`"
        class="flex items-center gap-2 rounded px-2 py-1 text-xs disabled:opacity-40"
      >
        <span class="h-2 w-24 overflow-hidden rounded bg-slate-800">
          <span
            class="block h-full transition-all"
            :class="usageColor()"
            :style="`width: ${usagePercent()}%`"
          ></span>
        </span>
        <span x-text="contextTokens === null ? '—' : `${usagePercent()}%`"></span>
      </button>
    </header>

    <main class="flex-1 space-y-4 overflow-y-auto px-4 py-4">
      <template x-for="(m, i) in messages" :key="i">
        <div>
          <div
            class="max-w-[85%] rounded-lg px-3 py-2 whitespace-pre-wrap"
            :class="m.role === 'user' ? 'ml-auto bg-sky-700' : 'bg-slate-800'"
            x-text="m.content"
          ></div>
          <!-- Status lines for the in-progress assistant turn: tool
               calls/results, thinking, compacting, verifying — every
               phase where the model is doing something with no visible
               answer text yet. -->
          <template x-if="m.role === 'assistant' && m.status.length">
            <ul class="mt-1 space-y-0.5 text-xs italic text-slate-400">
              <template x-for="(s, j) in m.status" :key="j">
                <li x-text="s"></li>
              </template>
            </ul>
          </template>
        </div>
      </template>
    </main>

    <footer class="border-t border-slate-800 p-4">
      <form @submit.prevent="send()" class="flex gap-2">
        <input
          type="text"
          x-model="input"
          :disabled="streaming"
          placeholder="Ask about the ingested documents... (or type /compact)"
          class="flex-1 rounded bg-slate-800 px-3 py-2 text-sm disabled:opacity-50"
        >
        <button
          type="submit"
          :disabled="streaming || !input.trim()"
          class="rounded bg-sky-700 px-4 py-2 text-sm font-medium disabled:opacity-40"
        >
          Send
        </button>
      </form>
      <p x-show="errorMessage" x-text="errorMessage" class="mt-2 text-xs text-red-400"></p>
    </footer>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
